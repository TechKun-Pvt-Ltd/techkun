<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Every glyph sits in a 20-unit live area on a 24-unit canvas" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <style>
        .bg { fill: #ffffff; }
        .ink { fill: #1c1c1a; }
        .quiet { fill: #6b6b66; }
        .edge { fill: none; stroke: #a3a39d; stroke-width: 1.25; }
        .grid { fill: none; stroke: #deded9; stroke-width: 0.75; }
        .tint { fill: #ecece8; }
        .live { fill: none; stroke: #2f7ad9; stroke-width: 2; }
        .keyline { fill: #2f7ad9; fill-opacity: 0.12; stroke: #2f7ad9; stroke-width: 2; }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #1c1c1a; }
            .ink { fill: #ecece8; }
            .quiet { fill: #a3a39d; }
            .edge { stroke: #6b6b66; }
            .grid { stroke: #3a3a37; }
            .tint { fill: #34342f; }
            .live { stroke: #5aa0ff; }
            .keyline { fill: #5aa0ff; stroke: #5aa0ff; }
        }
    </style>
    <defs>
        <pattern id="grid-11" width="11" height="11" patternUnits="userSpaceOnUse">
            <path class="grid" d="M 11 0 L 0 0 0 11" />
        </pattern>
        <pattern id="grid-5" width="5" height="5" patternUnits="userSpaceOnUse">
            <path class="grid" d="M 5 0 L 0 0 0 5" />
        </pattern>
        <!-- 24-unit canvas at 5px per unit, padding band tinted -->
        <g id="small-canvas">
            <rect class="tint" x="0" y="0" width="120" height="10" />
            <rect class="tint" x="0" y="110" width="120" height="10" />
            <rect class="tint" x="0" y="10" width="10" height="100" />
            <rect class="tint" x="110" y="10" width="10" height="100" />
            <rect x="0" y="0" width="120" height="120" fill="url(#grid-5)" />
            <rect class="edge" x="0" y="0" width="120" height="120" />
        </g>
    </defs>

    <rect class="bg" x="0" y="0" width="760" height="420" />

    <text class="ink" x="24" y="34" font-size="15" font-weight="600">Every glyph sits in a 20-unit live area on a 24-unit canvas</text>

    <!-- Canvas at 11px per unit -->
    <g transform="translate(24 64)">
        <rect class="tint" x="0" y="0" width="264" height="22" />
        <rect class="tint" x="0" y="242" width="264" height="22" />
        <rect class="tint" x="0" y="22" width="22" height="220" />
        <rect class="tint" x="242" y="22" width="22" height="220" />
        <rect x="0" y="0" width="264" height="264" fill="url(#grid-11)" />
        <rect class="edge" x="0" y="0" width="264" height="264" />
        <rect class="live" x="22" y="22" width="220" height="220" />
    </g>

    <!-- Legend -->
    <rect class="tint" x="24" y="350" width="14" height="14" />
    <rect class="edge" x="24" y="350" width="14" height="14" stroke-width="1" />
    <text class="ink" x="46" y="362">Padding: 2 units, nothing drawn</text>
    <rect class="live" x="24" y="376" width="14" height="14" />
    <text class="ink" x="46" y="388">Live area: 20 × 20 units</text>

    <!-- Keylines -->
    <g transform="translate(356 64)">
        <use href="#small-canvas" />
        <circle class="keyline" cx="60" cy="60" r="50" />
        <text class="ink" x="60" y="144" text-anchor="middle" font-weight="600">Circle</text>
        <text class="quiet" x="60" y="162" text-anchor="middle" font-size="11.5">ø 20</text>
    </g>
    <g transform="translate(556 64)">
        <use href="#small-canvas" />
        <rect class="keyline" x="15" y="15" width="90" height="90" rx="5" />
        <text class="ink" x="60" y="144" text-anchor="middle" font-weight="600">Square</text>
        <text class="quiet" x="60" y="162" text-anchor="middle" font-size="11.5">18 × 18</text>
    </g>
    <g transform="translate(356 236)">
        <use href="#small-canvas" />
        <rect class="keyline" x="20" y="10" width="80" height="100" rx="5" />
        <text class="ink" x="60" y="144" text-anchor="middle" font-weight="600">Portrait</text>
        <text class="quiet" x="60" y="162" text-anchor="middle" font-size="11.5">16 × 20</text>
    </g>
    <g transform="translate(556 236)">
        <use href="#small-canvas" />
        <rect class="keyline" x="10" y="20" width="100" height="80" rx="5" />
        <text class="ink" x="60" y="144" text-anchor="middle" font-weight="600">Landscape</text>
        <text class="quiet" x="60" y="162" text-anchor="middle" font-size="11.5">20 × 16</text>
    </g>
</svg>
